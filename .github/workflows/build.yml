name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing keystore
        env:
          ECO_STORE_BASE64: ${{ secrets.ECO_STORE_BASE64 }}
          ECO_STORE_PASSWORD: ${{ secrets.ECO_STORE_PASSWORD }}
          ECO_KEY_ALIAS: ${{ secrets.ECO_KEY_ALIAS }}
          ECO_KEY_PASSWORD: ${{ secrets.ECO_KEY_PASSWORD }}
        run: |
          STRIPPED_SECRET=$(echo "$ECO_STORE_BASE64" | tr -d '[:space:]')
          if [ -z "$STRIPPED_SECRET" ]; then
            echo "::error::ECO_STORE_BASE64 is empty. Local app/keystore.jks is gitignored and is not available to GitHub Actions; add or update ECO_STORE_BASE64 under this repository's Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$ECO_STORE_PASSWORD" ] || [ -z "$ECO_KEY_ALIAS" ] || [ -z "$ECO_KEY_PASSWORD" ]; then
            echo "::error::ECO_STORE_PASSWORD, ECO_KEY_ALIAS, and ECO_KEY_PASSWORD are required for release signing."
            exit 1
          fi

          if ! printf '%s' "$STRIPPED_SECRET" | base64 --decode > app/keystore.jks 2>/dev/null || [ ! -s app/keystore.jks ]; then
            rm -f app/keystore.jks
            echo "::error::ECO_STORE_BASE64 did not decode to a valid non-empty keystore file."
            exit 1
          fi

      - name: Determine Automated SemVer & Version Code
        id: versioning
        run: |
          git fetch --tags || true

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME=$(git describe --tags --abbrev=0 2>/devnull || echo "v1.2.0")
          fi

          SEMVER="${TAG_NAME#v}"
          SEMVER="${SEMVER#V}"

          MAJOR=$(echo "$SEMVER" | cut -d. -f1)
          MINOR=$(echo "$SEMVER" | cut -d. -f2)
          PATCH=$(echo "$SEMVER" | cut -d. -f3 | cut -d- -f1)

          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "VERSION_NAME=${SEMVER}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          echo "Determined SemVer Version Name: ${SEMVER}"
          echo "Determined Android Version Code: ${VERSION_CODE}"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          ECO_STORE_PASSWORD: ${{ secrets.ECO_STORE_PASSWORD }}
          ECO_KEY_ALIAS: ${{ secrets.ECO_KEY_ALIAS }}
          ECO_KEY_PASSWORD: ${{ secrets.ECO_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: EcoMonitor-v${{ env.VERSION_NAME }}-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION_NAME }}"
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
